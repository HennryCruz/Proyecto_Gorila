<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#3b0f26">
<title>💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#3b0f26;--rose:#e8557a;--blush:#ffd9e2;--cream:#fff6ee;--gold:#f7c56b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Quicksand',system-ui,sans-serif;background:var(--wine);color:var(--cream);overflow-x:hidden}
.script{font-family:'Pacifico',cursive,serif;font-weight:400}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 30% 20%,#7a2150 0,#3b0f26 60%);transition:opacity .9s,visibility .9s}
#gate.out{opacity:0;visibility:hidden}
.card{position:relative;z-index:2;width:min(380px,100%);text-align:center}
.card .big{font-size:3.4rem;margin-bottom:6px;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.card h1{font-size:2rem;margin-bottom:10px;color:var(--blush)}
.card p{opacity:.85;margin-bottom:22px;line-height:1.5}
.card input{width:100%;padding:15px 18px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:600 1.15rem 'Quicksand',sans-serif;text-align:center;letter-spacing:.08em;outline:none}
.card input:focus{border-color:var(--rose)}
.card input::placeholder{color:rgba(255,255,255,.4)}
.btn{margin-top:14px;width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff7a9a,var(--rose));color:#fff;font:700 1.05rem 'Quicksand',sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(232,85,122,.4);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6}
#err{min-height:24px;margin-top:12px;color:#ffb3c4;font-weight:600}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* story */
#story{display:none;position:relative}
#bgA,#bgB{position:fixed;inset:-40px;z-index:0;background-size:cover;background-position:center;filter:blur(34px) brightness(.55) saturate(1.2);transform:scale(1.1);opacity:0;transition:opacity 1.2s}
#bgA.on,#bgB.on{opacity:1}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));z-index:30}
main{position:relative;z-index:2}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 22px;text-align:center}
.hero h2{font-size:clamp(2.6rem,11vw,5rem);line-height:1.15;color:var(--blush);text-shadow:0 4px 30px rgba(0,0,0,.4)}
.hero .nm{display:block;font-size:clamp(2rem,9vw,3.6rem);color:var(--gold);margin-top:6px}
.hero p{margin-top:20px;font-size:1.15rem;opacity:.9}
.down{margin-top:44px;font-size:2rem;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(12px)}}
.count .n{font-size:clamp(5rem,26vw,10rem);font-weight:700;line-height:1;color:var(--gold);text-shadow:0 6px 40px rgba(247,197,107,.4)}
.count .l{font-size:1.4rem;margin-top:8px}
.count .s{margin-top:18px;opacity:.8}

.polaroid{background:var(--cream);padding:14px 14px 18px;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.5);max-width:min(92vw,520px);color:#4a1530}
.polaroid img{display:block;width:100%;height:auto;border-radius:3px;background:#ddd}
.polaroid figcaption{margin-top:16px;font:600 1.12rem/1.45 'Quicksand',sans-serif}
.polaroid .k{display:block;font-family:'Pacifico',cursive;color:var(--rose);font-size:.95rem;margin-bottom:6px}
.rv{opacity:0;transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.rv.a{transform:translateX(-60px) rotate(-8deg) scale(.9)}
.rv.b{transform:translateX(60px) rotate(8deg) scale(.9)}
.rv.c{transform:translateY(80px) scale(.8)}
.rv.d{transform:perspective(900px) rotateY(70deg) scale(.9)}
.rv.in{opacity:1;transform:none}
.polaroid.in.t1{transform:rotate(-2.2deg)}
.polaroid.in.t2{transform:rotate(2.2deg)}

.letter{max-width:560px}
.letter h3{font-size:2.2rem;color:var(--gold);margin-bottom:22px}
.letter p{font-size:1.2rem;line-height:1.75;min-height:12em;text-align:left;white-space:pre-wrap}
.letter .btn{max-width:300px;margin:28px auto 0;display:none}
.finale{display:none;margin-top:30px}
.finale h4{font-size:clamp(2rem,9vw,3.2rem);color:var(--blush);line-height:1.25}
.finale p{margin-top:14px;font-size:1.15rem;opacity:.9}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.loader{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:var(--wine);gap:14px}
.loader .big{font-size:3rem;animation:beat 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>

<div id="gate">
  <div class="card" id="card">
    <div class="big">💌</div>
    <h1 class="script">Es solo para ti</h1>
    <p>Escribe la fecha en que nos hicimos novios<br><small style="opacity:.7">(día, mes y año)</small></p>
    <form id="f" autocomplete="off">
      <input id="pw" inputmode="numeric" placeholder="DD / MM / AAAA" aria-label="Fecha" required>
      <button class="btn" id="go" type="submit">Abrir 💖</button>
    </form>
    <div id="err" role="alert"></div>
  </div>
</div>

<div class="loader" id="loader"><div class="big">💗</div><div class="script" style="font-size:1.4rem">Preparando recuerdos…</div></div>

<div id="story">
  <div id="bar"></div>
  <div id="bgA"></div><div id="bgB"></div>
  <canvas id="fx"></canvas>
  <main id="main"></main>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const ITER=600000;

/* corazones flotando */
const hs=$('#hearts'),em=['💖','💕','💗','✨','🌸','💘'];
for(let i=0;i<16;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
 s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*22)+'px';
 s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';hs.appendChild(s)}

/* cripto */
async function deriveKey(pw,salt){
 const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
}
const dec=(k,u)=>crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));

$('#f').addEventListener('submit',async e=>{
 e.preventDefault();
 const pw=$('#pw').value.replace(/\D/g,'');
 const btn=$('#go'),err=$('#err');
 err.textContent='';btn.disabled=true;btn.textContent='Abriendo…';
 try{
  const m=new Uint8Array(await (await fetch('d/m.bin')).arrayBuffer());
  const key=await deriveKey(pw,m.slice(0,16));
  let man;
  try{man=JSON.parse(new TextDecoder().decode(await dec(key,m.slice(16))))}
  catch{throw 'bad'}
  $('#gate').classList.add('out');
  $('#loader').style.display='flex';
  const urls=await Promise.all(man.photos.map(async(p,i)=>{
    const u=new Uint8Array(await (await fetch('d/i/'+String(i).padStart(2,'0')+'.bin')).arrayBuffer());
    return URL.createObjectURL(new Blob([await dec(key,u)],{type:'image/jpeg'}));
  }));
  build(man,urls);
  $('#loader').style.display='none';
  $('#gate').remove();
  window.scrollTo(0,0);
 }catch(x){
  btn.disabled=false;btn.textContent='Abrir 💖';
  err.textContent=x==='bad'?'Mmm, esa no es 😅 inténtalo otra vez':'No se pudo abrir, revisa tu conexión';
  const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
 }
});

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function build(m,urls){
 document.title='Para '+m.name+' 💖';
 const main=$('#main');
 const fx=['a','b','c','d'];
 let h=`<section class="hero rv c"><h2 class="script">${esc(m.heroTitle)}<span class="nm">${esc(m.name)}</span></h2><p>${esc(m.heroSub)}</p><div class="down">↓</div></section>`;
 h+=`<section class="count rv c"><div class="n" id="days">0</div><div class="l script">${esc(m.countLabel)}</div><div class="s">y lo que falta 💞</div></section>`;
 m.photos.forEach((p,i)=>{
  h+=`<section class="scene" data-i="${i}"><figure class="polaroid rv ${fx[i%4]} t${i%2+1}"><img src="${urls[i]}" width="${p.w}" height="${p.h}" alt=""><figcaption><span class="k">${String(i+1).padStart(2,'0')} / ${m.photos.length}</span>${esc(p.c)}</figcaption></figure></section>`;
 });
 h+=`<section class="letter-s"><div class="letter rv c"><h3 class="script">${esc(m.letterTitle)}</h3><p id="lt"></p><button class="btn" id="gift">${esc(m.giftButton)}</button><div class="finale" id="fin"><h4 class="script">${esc(m.finale)}</h4><p>${esc(m.finaleSub)}</p></div></div></section>`;
 main.innerHTML=h;
 $('#story').style.display='block';

 /* contador de días */
 const [y,mo,d]=m.since.split('-').map(Number);
 const days=Math.max(0,Math.floor((new Date()-new Date(y,mo-1,d))/864e5));
 const de=$('#days');let n=0;const step=Math.max(1,Math.ceil(days/60));
 const tick=()=>{n=Math.min(days,n+step);de.textContent=n;if(n<days)requestAnimationFrame(tick)};

 /* fondo difuminado que cambia con cada foto */
 const A=$('#bgA'),B=$('#bgB');let cur=A,first=true;
 function setBg(u){const nx=cur===A?B:A;nx.style.backgroundImage=`url(${u})`;nx.classList.add('on');if(!first)cur.classList.remove('on');first=false;cur=nx}
 setBg(urls[0]);

 /* revelar al hacer scroll */
 let typed=false,counted=false;
 const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  const el=e.target;el.classList.add('in');
  if(el.classList.contains('count')&&!counted){counted=true;tick()}
  const sc=el.closest('.scene');if(sc)setBg(urls[sc.dataset.i]);
  if(el.closest('.letter-s')&&!typed){typed=true;typeLetter(m.letter)}
 }),{threshold:.35});
 document.querySelectorAll('.rv').forEach(el=>io.observe(el));

 /* barra de progreso */
 addEventListener('scroll',()=>{const s=document.documentElement;$('#bar').style.width=(scrollY/(s.scrollHeight-innerHeight)*100)+'%'},{passive:true});

 /* carta con efecto de escritura */
 function typeLetter(t){const p=$('#lt');let i=0;
  (function w(){p.textContent=t.slice(0,++i);if(i<t.length)setTimeout(w,28);else{const g=$('#gift');g.style.display='block'}})();}
 $('#gift').addEventListener('click',()=>{
  $('#gift').style.display='none';$('#fin').style.display='block';confetti();
  $('#fin').scrollIntoView({behavior:'smooth',block:'center'});
 });
}

/* confeti */
function confetti(){
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#ff7a9a','#f7c56b','#fff','#e8557a','#ffd9e2','#9be7c4'];
 const ps=Array.from({length:170},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*7,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.random()*cols.length|0],h:Math.random()<.35}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;
   if(p.h){x.font=p.r*3+'px serif';x.fillText('❤',0,0)}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
  if(++t<420)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
})();
</script>
</body>
</html>
