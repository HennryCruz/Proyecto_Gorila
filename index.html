<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#faf6f1">
<title>💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--ink:#2d2326;--soft:#8a7a7d;--rose:#b5707c;--line:#e7dcd6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.script{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400}

/* entrada */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg);transition:opacity .9s,visibility .9s}
#gate.out{opacity:0;visibility:hidden}
.card{width:min(340px,100%);text-align:center}
.card .big{font-size:1.5rem;color:var(--rose);margin-bottom:18px}
.card h1{font-size:2.6rem;margin-bottom:14px;line-height:1.1}
.card p{color:var(--soft);line-height:1.7;margin-bottom:30px;font-size:.95rem}
.card input{width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:400 1.5rem 'Cormorant Garamond',serif;text-align:center;letter-spacing:.18em;outline:none}
.card input:focus{border-bottom-color:var(--rose)}
.card input::placeholder{color:#d2c5c0}
.btn{margin-top:28px;padding:13px 36px;border:1px solid var(--rose);border-radius:999px;background:transparent;color:var(--rose);font:400 .78rem 'Jost',sans-serif;letter-spacing:.26em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.btn:hover,.btn:active{background:var(--rose);color:#fff}
.btn[disabled]{opacity:.5}
#err{min-height:24px;margin-top:18px;color:var(--rose);font-size:.9rem}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(8px)}}
@keyframes beat{0%,100%{opacity:.4}50%{opacity:1}}

/* historia */
#story{display:none;position:relative}
#bgA,#bgB{display:none}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--rose);z-index:30}
main{position:relative;z-index:2}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center}
.hero:before{content:'';display:block;width:1px;height:72px;background:var(--line);margin-bottom:40px}
.hero h2{font-size:clamp(3rem,13vw,5.6rem);line-height:1.05}
.hero .nm{display:block;font-size:clamp(2.4rem,10vw,4rem);color:var(--rose);margin-top:10px}
.hero p{margin-top:30px;color:var(--soft);letter-spacing:.16em;font-size:.85rem}
.down{margin-top:52px;color:var(--rose);font-size:1.2rem;animation:bob 2.2s infinite}
.count .n{font:400 clamp(6.5rem,32vw,11rem)/1 'Cormorant Garamond',serif}
.count .l{margin-top:6px;font-size:1.6rem;color:var(--rose)}
.count .s{margin-top:24px;color:var(--soft);letter-spacing:.14em;font-size:.85rem}

.polaroid{max-width:min(88vw,460px);margin:0}
.polaroid img{display:block;width:100%;height:auto;border-radius:2px;box-shadow:0 20px 50px rgba(60,35,40,.13);background:#eee}
.polaroid figcaption{margin-top:28px;font:italic 400 1.4rem/1.5 'Cormorant Garamond',serif}
.polaroid .k{display:block;font:400 .68rem 'Jost',sans-serif;font-style:normal;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);margin-bottom:14px}
.scene:after{content:'';display:block;width:1px;height:60px;background:var(--line);margin-top:56px}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

.letter{max-width:520px}
.letter h3{font-size:2.6rem;color:var(--rose);margin-bottom:32px}
#lt{font:400 1.3rem/1.85 'Cormorant Garamond',serif;text-align:left;white-space:pre-wrap}
#gift{display:none;margin:36px auto 0}
.riddle .btn{margin-top:24px}
.finale{display:none;margin-top:44px}
.finale h4{font-size:clamp(2.3rem,10vw,3.4rem);line-height:1.2}
.finale>p{margin-top:16px;color:var(--soft);line-height:1.7}
.riddle{margin-top:34px;padding:28px 22px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.6)}
.riddle .rq{white-space:pre-line;font:italic 400 1.25rem/1.8 'Cormorant Garamond',serif;margin:0 0 20px}
.riddle input{width:100%;padding:11px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:400 1.2rem 'Cormorant Garamond',serif;text-align:center;outline:none}
.riddle input:focus{border-bottom-color:var(--rose)}
#rm{min-height:24px;margin-top:16px;color:var(--rose);font-size:.9rem}
.reveal h4{font-size:2.5rem;color:var(--rose);margin-top:32px}
.reveal p{margin-top:12px;font-size:1.05rem;line-height:1.8}
.snd{position:fixed;top:14px;right:14px;z-index:35;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(250,246,241,.85);color:var(--rose);font-size:1rem;cursor:pointer;backdrop-filter:blur(6px)}
.snd.off{opacity:.45;text-decoration:line-through}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.loader{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);gap:14px;color:var(--rose)}
.loader .big{font-size:2rem;animation:beat 1.6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="card" id="card">
    <div class="big">♡</div>
    <h1 class="script">Solo para ti</h1>
    <p>Escribe la fecha en que nos hicimos novios</p>
    <form id="f" autocomplete="off">
      <input id="pw" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" aria-label="Fecha" required>
      <button class="btn" id="go" type="submit">Entrar</button>
    </form>
    <div id="err" role="alert"></div>
  </div>
</div>

<div class="loader" id="loader"><div class="big">♡</div><div class="script" style="font-size:1.5rem">Preparando recuerdos…</div></div>

<div id="story">
  <div id="bar"></div>
  <button id="snd" class="snd" aria-label="Música">♪</button>
  <div id="bgA"></div><div id="bgB"></div>
  <canvas id="fx"></canvas>
  <main id="main"></main>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const ITER=600000;

/* cripto */
async function deriveKey(pw,salt){
 const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
}
const dec=(k,u)=>crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));

$('#pw').addEventListener('input',e=>{
 const del=e.inputType&&e.inputType.startsWith('delete');
 const d=e.target.value.replace(/\D/g,'').slice(0,8);
 let o=d.slice(0,2);
 if(d.length>2)o+='/'+d.slice(2,4);
 if(d.length>4)o+='/'+d.slice(4);
 if(!del&&(d.length===2||d.length===4))o+='/';
 e.target.value=o;
});

$('#f').addEventListener('submit',async e=>{
 e.preventDefault();
 const pw=$('#pw').value.replace(/\D/g,'');
 const btn=$('#go'),err=$('#err');
 err.textContent='';btn.disabled=true;btn.textContent='Abriendo…';
 const aud=makeAudio();
 try{
  const m=new Uint8Array(await (await fetch('d/m.bin')).arrayBuffer());
  const key=await deriveKey(pw,m.slice(0,16));
  let man;
  try{man=JSON.parse(new TextDecoder().decode(await dec(key,m.slice(16))))}
  catch{throw 'bad'}
  $('#gate').classList.add('out');
  $('#loader').style.display='flex';
  const urls=await Promise.all(man.photos.map(async(p,i)=>{
    const u=new Uint8Array(await (await fetch('d/i/'+String(i).padStart(2,'0')+'.bin')).arrayBuffer());
    return URL.createObjectURL(new Blob([await dec(key,u)],{type:'image/jpeg'}));
  }));
  build(man,urls);
  startMusic(aud);
  $('#loader').style.display='none';
  $('#gate').remove();
  window.scrollTo(0,0);
 }catch(x){
  if(aud)aud.close();
  btn.disabled=false;btn.textContent='Entrar';
  err.textContent=x==='bad'?'Esa no es… inténtalo otra vez':'No se pudo abrir, revisa tu conexión';
  const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
 }
});

const strip=s=>s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu,'').replace(/[ \t]+([.!?,;:\n])/g,'$1').replace(/[ \t]+$/gm,'').trim();
function esc(s){return strip(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmt(s){const [yy,mm,dd]=s.split('-').map(Number);return dd+' de '+MES[mm-1]+' de '+yy}

/* música: melodía original generada en el navegador */
function makeAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;const c=new AC();if(c.resume)c.resume();return c}catch(e){return null}}
function startMusic(c){
 if(!c)return;
 /* reverb de sala suave */
 const len=c.sampleRate*3,ir=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
 const conv=c.createConvolver();conv.buffer=ir;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
 const master=c.createGain();master.gain.value=1;
 const dry=c.createGain();dry.gain.value=.8;
 const wet=c.createGain();wet.gain.value=.4;
 master.connect(lp);lp.connect(dry);dry.connect(c.destination);
 lp.connect(conv);conv.connect(wet);wet.connect(c.destination);
 /* timbre tipo piano suave */
 const wave=c.createPeriodicWave(new Float32Array(5),new Float32Array([0,1,.42,.16,.06]));
 const f=m=>440*Math.pow(2,(m-69)/12);
 const E=.4545,B=E*2;
 /* progresión: C · G/B · Am · Em/G · F · C/E · Dm7 · G  (bajo + 3 notas del acorde) */
 const chords=[[48,55,60,64],[47,55,59,62],[45,52,57,60],[43,52,59,64],[41,53,57,60],[40,55,60,64],[38,53,57,60],[43,50,55,59]];
 /* melodía original: [tiempo, nota MIDI, duración en tiempos] */
 const mel=[
  [[0,76,1.5],[1.5,74,.5],[2,72,1],[3,67,1]],
  [[0,71,1.5],[1.5,74,.5],[2,79,2]],
  [[0,81,1.5],[1.5,79,.5],[2,76,1],[3,72,1]],
  [[0,76,2],[2,74,1],[3,76,1]],
  [[0,77,1.5],[1.5,76,.5],[2,72,1],[3,69,1]],
  [[0,72,1.5],[1.5,76,.5],[2,79,2]],
  [[0,77,1.5],[1.5,76,.5],[2,74,1],[3,72,1]],
  [[0,74,2],[2,71,1],[3,67,1]]
 ];
 const arp=[0,1,2,3,2,3,2,1];
 function note(m,t,dur,vol){
  t+=(Math.random()-.5)*.02;
  const o=c.createOscillator(),g=c.createGain();o.setPeriodicWave(wave);o.frequency.value=f(m);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
 }
 function pad(m,t,dur,vol){
  const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f(m);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+1.2);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
 }
 let k=0,next=c.currentTime+.4;
 function sched(){
  while(next<c.currentTime+3){
   const i=k%8,ch=chords[i],second=Math.floor(k/8)%2===1;
   arp.forEach((a,j)=>note(ch[a],next+j*E,a===0?2.2:1.4,a===0?.07:.04));
   ch.slice(1).forEach(m=>pad(m,next,B*4+.8,.012));
   mel[i].forEach(([b,m,d])=>{
    note(m,next+b*B,d*B*1.2+1.4,.12);
    if(second)note(m-12,next+b*B,d*B*1.2+1.2,.045);
   });
   next+=8*E;k++;
  }
 }
 sched();setInterval(sched,500);
 const btn=$('#snd');let muted=false;
 btn.onclick=()=>{muted=!muted;if(muted)c.suspend();else c.resume();btn.classList.toggle('off',muted)};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)c.suspend();else if(!muted)c.resume()});
}

function build(m,urls){
 document.title='Para '+m.name;
 const main=$('#main');
 const fx=['a','b','c','d'];
 let h=`<section class="hero rv c"><h2 class="script">${esc(m.heroTitle)}<span class="nm">${esc(m.name)}</span></h2><p>${esc(m.heroSub)}</p><div class="down">↓</div></section>`;
 h+=`<section class="count rv c"><div class="n" id="days">0</div><div class="l script">${esc(m.countLabel)}</div><div class="s">y lo que falta</div></section>`;
 m.photos.forEach((p,i)=>{
  h+=`<section class="scene" data-i="${i}"><figure class="polaroid rv ${fx[i%4]} t${i%2+1}"><img src="${urls[i]}" width="${p.w}" height="${p.h}" alt=""><figcaption><span class="k">${fmt(p.d)}</span>${esc(p.c)}</figcaption></figure></section>`;
 });
 h+=`<section class="letter-s"><div class="letter rv c"><h3 class="script">${esc(m.letterTitle)}</h3><p id="lt"></p><button class="btn" id="gift">${esc(m.giftButton)}</button><div class="finale" id="fin"><h4 class="script">${esc(m.finale)}</h4><p>${esc(m.finaleSub)}</p><div class="riddle" id="rd"><p class="rq">${esc(m.riddle)}</p><form id="rf" autocomplete="off"><input id="ra" placeholder="Tu respuesta…" aria-label="Respuesta"><button class="btn" type="submit">Resolver 🔍</button></form><div id="rm"></div></div><div class="reveal" id="rev"></div></div></div></section>`;
 main.innerHTML=h;
 $('#story').style.display='block';

 /* contador de días */
 const [y,mo,d]=m.since.split('-').map(Number);
 const days=Math.max(0,Math.floor((new Date()-new Date(y,mo-1,d))/864e5));
 const de=$('#days');let n=0;const step=Math.max(1,Math.ceil(days/60));
 const tick=()=>{n=Math.min(days,n+step);de.textContent=n;if(n<days)requestAnimationFrame(tick)};

 /* fondo difuminado que cambia con cada foto */
 const A=$('#bgA'),B=$('#bgB');let cur=A,first=true;
 function setBg(u){const nx=cur===A?B:A;nx.style.backgroundImage=`url(${u})`;nx.classList.add('on');if(!first)cur.classList.remove('on');first=false;cur=nx}
 setBg(urls[0]);

 /* revelar al hacer scroll */
 let typed=false,counted=false;
 const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  const el=e.target;el.classList.add('in');
  if(el.classList.contains('count')&&!counted){counted=true;tick()}
  const sc=el.closest('.scene');if(sc)setBg(urls[sc.dataset.i]);
  if(el.closest('.letter-s')&&!typed){typed=true;typeLetter(m.letter)}
 }),{threshold:.35});
 document.querySelectorAll('.rv').forEach(el=>io.observe(el));

 /* barra de progreso */
 addEventListener('scroll',()=>{const s=document.documentElement;$('#bar').style.width=(scrollY/(s.scrollHeight-innerHeight)*100)+'%'},{passive:true});

 /* carta con efecto de escritura */
 function typeLetter(t){
  t=strip(t);const p=$('#lt');let i=0,done=false;
  const show=n=>{p.innerHTML=esc(t.slice(0,n))+'<span style="visibility:hidden">'+esc(t.slice(n))+'</span>'};
  const fin=()=>{done=true;show(t.length);$('#gift').style.display='block'};
  p.addEventListener('click',()=>{if(!done)fin()});
  (function w(){if(done)return;show(++i);if(i<t.length)setTimeout(w,20);else fin()})();
 }
 $('#gift').addEventListener('click',()=>{
  $('#gift').style.display='none';$('#fin').style.display='block';confetti();
  $('#fin').scrollIntoView({behavior:'smooth',block:'center'});
 });

 /* acertijo */
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
 let tries=0;
 $('#rf').addEventListener('submit',e=>{
  e.preventDefault();
  const raw=norm($('#ra').value),a=raw.replace(/^(las|la|unas|una)(?=.)/,''),rm=$('#rm');
  if((m.answers||[]).includes(a)){
   const [y2,m2,d2]=m.tripDate.split('-').map(Number),n0=new Date();
   const diff=Math.round((new Date(y2,m2-1,d2)-new Date(n0.getFullYear(),n0.getMonth(),n0.getDate()))/864e5);
   const when=diff===1?'Mañana':diff<=0?'Hoy':'El '+d2+' de '+MES[m2-1];
   $('#rd').style.display='none';
   $('#rev').innerHTML='<h4 class="script">¡Eso es!</h4><p>'+when+' '+esc(m.reveal)+'</p>';
   confetti();$('#rev').scrollIntoView({behavior:'smooth',block:'center'});
   return;
  }
  tries++;
  rm.textContent=(raw.includes('vino')?m.warm:m.wrong)+(tries>=2?'  '+m.hint:'');
 });
}

/* confeti */
function confetti(){
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#b5707c','#e8c4c4','#d9b99b','#c98f98','#efd9d4'];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*7,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.random()*cols.length|0],h:Math.random()<.35}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;
   if(p.h){x.font=p.r*3+'px serif';x.fillText('❤',0,0)}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
  if(++t<420)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
})();
</script>
</body>
</html>
